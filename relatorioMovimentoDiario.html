<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movimento Diário - SGC Customic</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body>
    <div id="sidebar-container" class="sidebar"></div>

    <div class="main-content">
      <div class="container">
        <h1>
          <i class="fa-solid fa-calendar-day"></i>
          Consulta Movimento Diário
        </h1>

        <!-- Filtros -->
        <div class="card">
          <h2>Posição de Estoque em</h2>
          <div class="filter-container">
            <div class="form-group">
              <label for="dataPosicao" style="font-size: 16px; font-weight: bold;">Data:</label>
              <input type="date" id="dataPosicao" style="font-size: 16px; padding: 12px; height: 45px;" required />
            </div>
            <div class="form-group">
              <label for="tipoProduto" style="font-size: 16px; font-weight: bold;">Tipo de Produto:</label>
              <select id="tipoProduto" style="font-size: 16px; padding: 12px; height: 45px;">
                <option value="EMBALAGEM" selected>EMBALAGEM (padrão)</option>
                <option value="">Todos os tipos</option>
              </select>
            </div>
            <div class="form-group">
              <button id="hojeBtn" class="btn-secundario" type="button">
                <i class="fa-solid fa-calendar-check"></i> HJ
              </button>
            </div>
            <div class="form-group">
              <button id="gerarRelatorioBtn" class="btn-destaque">
                <i class="fa-solid fa-magnifying-glass-chart"></i>
                Gerar Relatório
              </button>
            </div>
          </div>
        </div>

        <!-- Totalizadores -->
        <div id="totalizadoresContainer" style="display: none">
          <div class="estatisticas-inventario">
            <div class="stat-card">
              <i class="fa-solid fa-list"></i>
              <p>Movimentações</p>
              <strong id="totalItens">0</strong>
            </div>
            <div class="stat-card">
              <i class="fa-solid fa-cubes"></i>
              <p>Qtd. Total</p>
              <strong id="totalQnt">0</strong>
            </div>
            <div class="stat-card">
              <i class="fa-solid fa-sack-dollar"></i>
              <p>Valor Contábil</p>
              <strong id="valorContabil">R$ 0,00</strong>
            </div>
            <div class="stat-card">
              <i class="fa-solid fa-file-invoice-dollar"></i>
              <p>Valor Fiscal</p>
              <strong id="valorFiscal">R$ 0,00</strong>
            </div>
          </div>
        </div>

        <!-- Tabela -->
        <div id="resultadosContainer" style="display: none" class="card">
          <div class="table-actions">
            <h2>Movimentações do Dia</h2>
            <div>
              <button id="imprimirBtn" class="btn-secundario">
                <i class="fa-solid fa-print"></i> Imprimir
              </button>
              <button id="exportarExcelBtn" class="btn-success">
                <i class="fa-solid fa-file-excel"></i> Exportar Excel
              </button>
            </div>
          </div>
          <div id="tabelaRelatorio" style="overflow-x:auto;"></div>
        </div>

        <div id="statusMessage" class="status-message"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <script src="relatorioMovimentoDiario.js"></script>
    <script src="layout.js"></script>
    <script src="fundos.js"></script>
  </body>
</html>
