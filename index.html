<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - SGC Customic</title>
    <link rel="stylesheet" href="/shared/frontend/style.css" />
  </head>
  <body class="login-body">
    <div class="login-container" id="loginContainer">
      <div class="login-card">
        <h2>SGC - Sistema de Gestão Customic</h2>
        <form id="loginForm">
          <div class="form-group">
            <input type="text" id="usuario" placeholder="Usuário" required />
          </div>
          <div class="form-group">
            <input type="password" id="pw" placeholder="Senha" required />
          </div>
          <button type="submit" class="btn-login">Entrar</button>
        </form>
        <div class="login-status" id="loginStatus"></div>
      </div>
    </div>
    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();
          const usuario = document.getElementById("usuario").value;
          const pw = document.getElementById("pw").value;
          const status = document.getElementById("loginStatus");
          status.style.color = "#222";
          status.textContent = "Verificando...";

          try {
            const res = await fetch("/api/shared/auth", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ usuario, pw }),
            });
            const data = await res.json();
            if (res.ok && data.usuario) {
              console.log('LOGIN - Dados recebidos:', data.usuario);
              console.log('LOGIN - NIVEL:', data.usuario.NIVEL, 'tipo:', typeof data.usuario.NIVEL);
              
              const loginTime = new Date().toLocaleString("pt-BR");
              localStorage.setItem("loginTime", loginTime);
              localStorage.setItem(
                "userName",
                `${data.usuario.F_NAME} ${data.usuario.L_NAME}`
              );
              // Cargo/grupo (texto). Migra legados numéricos 1-4 no client se o SQL ainda não rodou.
              let nivel = String(data.usuario.NIVEL ?? "").trim();
              const legados = { "1": "adm", "2": "gerente_estoque", "3": "assistente_estoque", "4": "auxiliar_estoque" };
              if (legados[nivel]) nivel = legados[nivel];
              localStorage.setItem("userLevel", nivel.toLowerCase());
              localStorage.setItem("userCode", data.usuario.USUARIO);
              if (data.usuario.SETOR) localStorage.setItem("userSetor", data.usuario.SETOR);
              
              console.log('LOGIN - Salvou userLevel:', localStorage.getItem('userLevel'));
              window.location.href = "/menu.html";
            } else {
              status.style.color = "#c00";
              status.textContent =
                data.message || "Usuário ou senha inválidos.";
            }
          } catch (err) {
            status.style.color = "#c00";
            status.textContent = "Erro de conexão. Tente novamente.";
          }
        });
    </script>
  </body>
</html>
