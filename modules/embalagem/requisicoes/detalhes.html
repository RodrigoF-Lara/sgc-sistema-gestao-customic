<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detalhes da Requisição - Kardex</title>
    <link rel="stylesheet" href="/shared/frontend/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <style>
        .page-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .page-title-row h1 {
            margin: 0;
        }

        .itens-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .itens-header h2 {
            margin: 0;
        }
    </style>
</head>
<body>
    <!-- O novo menu lateral será carregado aqui pelo layout.js -->
    <div id="sidebar-container" class="sidebar"></div>

    <!-- Todo o conteúdo da página fica dentro desta div -->
    <div class="main-content">
        <div class="container">
            <div class="page-title-row">
                <h1>Detalhes da Requisição</h1>
                <button id="btnVoltarRequisicoes" class="btn-detalhes" type="button">
                    <i class="fa-solid fa-arrow-left"></i> Voltar para Requisições
                </button>
            </div>
            
            <div id="detalhe-header-container">
                <!-- O cabeçalho da requisição será inserido aqui -->
            </div>
            
            <div class="itens-header">
                <h2>Itens da Requisição</h2>
                <button id="exportarExcelBtn" class="btn-success">
                    <i class="fa-solid fa-file-excel"></i> Exportar Excel
                </button>
            </div>
            
            <div id="bulk-actions-container" class="bulk-actions-bar" style="display: none;">
                <span id="bulk-counter">0 itens selecionados</span>
                <select id="bulk-status-select">
                    <option value="">Alterar status para...</option>
                    <option value="Pendente">Pendente</option>
                    <option value="Em separação">Em separação</option>
                    <option value="Separado">Separado</option>
                    <option value="Aguarda coleta">Aguarda coleta</option>
                    <option value="Finalizado">Finalizado</option>
                </select>
                <button id="bulk-apply-btn" class="btn-destaque">Aplicar</button>
            </div>

            <div id="detalhe-itens-container">
                <!-- A tabela de itens será inserida aqui -->
            </div>
        </div>
    </div>

    <!-- Modal de Histórico/Log -->
    <div id="logModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Histórico do Item</h2>
                <span class="close-btn">&times;</span>
            </div>
            <div id="logContent">
                <!-- O histórico será inserido aqui pelo JavaScript -->
            </div>
        </div>
    </div>

    <!-- Biblioteca para exportar Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <script src="/shared/frontend/permissoes.js"></script>
    <script src="detalhes.js"></script>
    <!-- O novo script de layout que carrega o menu e o usuário -->
    <script src="/shared/frontend/layout.js"></script>
    <script src="/shared/frontend/fundos.js"></script>
    <script>
      (async function () {
        if (!window.SGCPermissoes) return;
        try {
          await SGCPermissoes.carregar();
          const ok =
            SGCPermissoes.podeAcessar('consultar-requisicoes') ||
            SGCPermissoes.podeAcessar('requisicoes');
          if (!ok) {
            alert('Sem permissão para consultar requisições.');
            window.location.href = '/menu.html';
          }
        } catch (e) { console.warn(e); }
      })();
    </script>
</body>
</html>
