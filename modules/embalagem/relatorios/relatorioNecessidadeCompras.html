<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Relatório de Necessidade de Compras - SGC Customic</title>
    <link rel="stylesheet" href="/shared/frontend/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <style>
      .status-chip {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.2px;
        text-transform: uppercase;
      }

      .status-abaixo {
        background: #ffe3e3;
        color: #b42318;
      }

      .status-minimo {
        background: #fff4cc;
        color: #9a6700;
      }

      .status-regular {
        background: #e8f2ff;
        color: #1d4ed8;
      }

      .status-excedente {
        background: #e8f8ef;
        color: #067647;
      }

      .status-sem-parametro {
        background: #f1f5f9;
        color: #475467;
      }

      .termometro-wrap {
        min-width: 180px;
      }

      .termometro-track {
        width: 100%;
        height: 10px;
        background: #e5e7eb;
        border-radius: 999px;
        overflow: hidden;
      }

      .termometro-fill {
        height: 100%;
        border-radius: 999px;
      }

      .termometro-meta {
        font-size: 11px;
        color: #475467;
        margin-top: 4px;
      }

      .kpi-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
        margin-top: 16px;
      }

      .kpi-card {
        border: 1px solid #d0d5dd;
        border-radius: 10px;
        padding: 12px;
        background: #fff;
      }

      .kpi-card p {
        margin: 0;
        font-size: 13px;
        color: #475467;
      }

      .kpi-card strong {
        display: block;
        margin-top: 4px;
        font-size: 22px;
      }

      .filtro-linha {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
      }

      .switch-row {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-top: 8px;
        flex-wrap: wrap;
      }

      .switch-row label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
      }

      .sortable {
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
      }

      .sortable i {
        margin-left: 6px;
        color: #98a2b3;
        font-size: 11px;
      }

      .filter-row th {
        padding-top: 10px;
        padding-bottom: 10px;
        background: #f8fafc;
      }

      .filter-input,
      .filter-select {
        width: 100%;
        min-width: 80px;
        padding: 8px 10px;
        border: 1px solid #d0d5dd;
        border-radius: 8px;
        font-size: 12px;
        background: #fff;
      }

      .filter-input::placeholder {
        color: #98a2b3;
      }

      .sem-resultados-tabela {
        text-align: center;
        color: #667085;
        padding: 24px 12px;
      }
    </style>
  </head>
  <body>
    <div id="sidebar-container" class="sidebar"></div>

    <div class="main-content">
      <div class="container">
        <h1>
          <i class="fa-solid fa-temperature-three-quarters"></i>
          Relatório de Necessidade de Compras
        </h1>

        <div class="card">
          <h2>Filtros</h2>
          <div class="filtro-linha">
            <div class="form-group">
              <label for="filtroCurvaABC">Curva ABC</label>
              <select id="filtroCurvaABC">
                <option value="">Todas</option>
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
              </select>
            </div>

            <div class="form-group">
              <label for="filtroTipoProduto">Tipo</label>
              <select id="filtroTipoProduto">
                <option value="">Todos</option>
              </select>
            </div>

            <div class="form-group">
              <label for="filtroStatus">Status do Termômetro</label>
              <select id="filtroStatus">
                <option value="">Todos</option>
                <option value="ABAIXO DO MINIMO">Abaixo do mínimo</option>
                <option value="NO MINIMO">No mínimo</option>
                <option value="REGULAR">Regular</option>
                <option value="EXCEDENTE">Excedente</option>
                <option value="SEM PARAMETRO">Sem parâmetro</option>
              </select>
            </div>
          </div>

          <div class="switch-row">
            <label><input type="checkbox" id="chkAtivos" checked /> Ativos</label>
            <label><input type="checkbox" id="chkInativos" /> Inativos</label>
          </div>

          <div class="form-group" style="margin-top: 14px">
            <button id="gerarRelatorioBtn" class="btn-destaque">
              <i class="fa-solid fa-magnifying-glass-chart"></i>
              Gerar Relatório
            </button>
          </div>
        </div>

        <div id="totalizadoresContainer" class="card" style="display: none">
          <h2>Resumo</h2>
          <div class="kpi-grid">
            <div class="kpi-card">
              <p>Total de Produtos</p>
              <strong id="kpiTotal">0</strong>
            </div>
            <div class="kpi-card">
              <p>Abaixo do Mínimo</p>
              <strong id="kpiAbaixo">0</strong>
            </div>
            <div class="kpi-card">
              <p>No Mínimo</p>
              <strong id="kpiMinimo">0</strong>
            </div>
            <div class="kpi-card">
              <p>Regular</p>
              <strong id="kpiRegular">0</strong>
            </div>
            <div class="kpi-card">
              <p>Excedente</p>
              <strong id="kpiExcedente">0</strong>
            </div>
            <div class="kpi-card">
              <p>Necessidade Total para Ideal</p>
              <strong id="kpiNecessidade">0</strong>
            </div>
          </div>
        </div>

        <div id="resultadosContainer" class="card" style="display: none">
          <div class="table-actions">
            <h2>Itens do Termômetro</h2>
            <div>
              <button id="imprimirBtn" class="btn-secundario">
                <i class="fa-solid fa-print"></i> Imprimir
              </button>
              <button id="exportarExcelBtn" class="btn-success">
                <i class="fa-solid fa-file-excel"></i> Exportar Excel
              </button>
            </div>
          </div>
          <div id="tabelaRelatorio"></div>
        </div>

        <div id="statusMessage" class="status-message"></div>
      </div>
    </div>

    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="relatorioNecessidadeCompras.js"></script>
    <script src="/shared/frontend/layout.js"></script>
    <script src="/shared/frontend/fundos.js"></script>
  </body>
</html>
