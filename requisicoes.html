<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Requisições - SGC Customic</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <style>
        .req-tabs { display: flex; gap: 4px; border-bottom: 2px solid #dee2e6; margin-bottom: 24px; }
        .req-tab {
            padding: 10px 24px;
            border: none;
            background: none;
            font-size: 15px;
            font-weight: 600;
            color: #6c757d;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            transition: color 0.2s, border-color 0.2s;
        }
        .req-tab:hover { color: var(--cor-principal); }
        .req-tab.active { color: var(--cor-principal); border-bottom-color: var(--cor-principal); }
        .req-tab i { margin-right: 8px; }
        .req-panel { display: none; }
        .req-panel.active { display: block; }

        /* Nova Requisição - cabeçalho */
        .nova-req-header { margin-bottom: 22px; }
        .nova-req-header h2 {
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--cor-principal);
            border: none;
            padding: 0;
        }
        .nova-req-subtitle {
            margin: 6px 0 0;
            color: #6c757d;
            font-size: 0.92em;
        }

        /* Grid do formulário */
        .nova-req-form { display: flex; flex-direction: column; gap: 22px; }
        .nova-req-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1.4fr;
            gap: 20px;
            align-items: start;
        }
        @media (max-width: 900px) {
            .nova-req-grid { grid-template-columns: 1fr; }
        }
        .nova-req-grid .form-group { display: flex; flex-direction: column; gap: 6px; }
        .nova-req-grid label {
            font-size: 0.82em;
            font-weight: 600;
            color: #495057;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .nova-req-grid label i { color: var(--cor-principal); }
        .nova-req-grid input[type="date"],
        .nova-req-grid select {
            padding: 11px 12px;
            border: 1px solid var(--cor-cinza-borda);
            border-radius: 6px;
            background: #fff;
            font-size: 0.95em;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .nova-req-grid input[type="date"]:focus,
        .nova-req-grid select:focus {
            border-color: var(--cor-principal);
            box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.15);
            outline: none;
        }

        /* Dropzone do arquivo */
        .form-group-file { min-width: 0; }
        .file-dropzone {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            border: 2px dashed var(--cor-cinza-borda);
            border-radius: 8px;
            background: #fafbfc;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            min-height: 60px;
        }
        .file-dropzone:hover,
        .file-dropzone.is-dragover {
            border-color: var(--cor-principal);
            background: rgba(25, 118, 210, 0.06);
        }
        .file-dropzone.has-file {
            border-style: solid;
            border-color: var(--cor-sucesso);
            background: rgba(40, 167, 69, 0.06);
        }
        .file-dropzone-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(25, 118, 210, 0.12);
            color: var(--cor-principal);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1em;
            flex-shrink: 0;
        }
        .file-dropzone.has-file .file-dropzone-icon {
            background: rgba(40, 167, 69, 0.15);
            color: var(--cor-sucesso);
        }
        .file-dropzone-text { display: flex; flex-direction: column; min-width: 0; }
        .file-dropzone-title {
            font-weight: 600;
            color: #212529;
            font-size: 0.95em;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .file-dropzone-hint {
            font-size: 0.8em;
            color: #6c757d;
            margin-top: 2px;
        }

        /* Ações */
        .nova-req-actions {
            display: flex;
            justify-content: flex-end;
            padding-top: 8px;
            border-top: 1px solid #eef0f3;
        }
        .btn-gerar {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 26px;
            font-size: 1em;
            font-weight: 600;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(25, 118, 210, 0.25);
        }
        .btn-gerar:hover { box-shadow: 0 4px 12px rgba(25, 118, 210, 0.35); }
    </style>
</head>
<body>
    <div id="sidebar-container" class="sidebar"></div>

    <div class="main-content">
        <div class="container">
            <h1><i class="fa-solid fa-file-lines"></i> Requisições</h1>

            <!-- Abas -->
            <div class="req-tabs">
                <button class="req-tab active" data-tab="nova" id="tabNova">
                    <i class="fa fa-plus-square"></i> Nova Requisição
                </button>
                <button class="req-tab" data-tab="consulta" id="tabConsulta">
                    <i class="fa fa-search"></i> Consultar
                </button>
            </div>

            <!-- Painel: Nova Requisição -->
            <div class="req-panel active" id="panelNova">
                <div id="novaRequisicaoContainer" class="card">
                    <div class="nova-req-header">
                        <h2><i class="fa-solid fa-clipboard-list"></i> Dados da Requisição</h2>
                        <p class="nova-req-subtitle">Informe a data de necessidade, prioridade e envie o arquivo CSV com os itens.</p>
                    </div>
                    <form id="csvForm" class="nova-req-form">
                        <div class="nova-req-grid">
                            <div class="form-group">
                                <label for="dtNecessidade"><i class="fa-solid fa-calendar-day"></i> Data de Necessidade</label>
                                <input type="date" id="dtNecessidade" required />
                            </div>
                            <div class="form-group">
                                <label for="prioridade"><i class="fa-solid fa-flag"></i> Prioridade</label>
                                <select id="prioridade" required>
                                    <option value="NORMAL">Normal</option>
                                    <option value="ALTA">Alta</option>
                                    <option value="BAIXA">Baixa</option>
                                </select>
                            </div>
                            <div class="form-group form-group-file">
                                <label><i class="fa-solid fa-file-csv"></i> Arquivo CSV</label>
                                <label for="csvFile" class="file-dropzone" id="fileDropzone">
                                    <div class="file-dropzone-icon"><i class="fa-solid fa-cloud-arrow-up"></i></div>
                                    <div class="file-dropzone-text">
                                        <span class="file-dropzone-title" id="fileDropzoneTitle">Clique para selecionar</span>
                                        <span class="file-dropzone-hint">ou arraste o arquivo .csv aqui</span>
                                    </div>
                                    <input type="file" id="csvFile" name="csvFile" accept=".csv" required hidden />
                                </label>
                            </div>
                        </div>
                        <div class="nova-req-actions">
                            <button type="submit" class="btn-destaque btn-gerar">
                                <i class="fa-solid fa-paper-plane"></i> Gerar Requisição
                            </button>
                        </div>
                    </form>
                    <div id="status"></div>
                    <div id="aguardeAnimacao"></div>
                </div>

                <div id="resumo-container" style="display: none;">
                    <h2>Resumo da Requisição Gerada</h2>
                    <table id="resumoRequisicao">
                        <thead>
                            <tr>
                                <th>ID Requisição</th>
                                <th>Data de Necessidade</th>
                                <th>Prioridade</th>
                                <th>Código</th>
                                <th>Quantidade</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <!-- Painel: Consultar -->
            <div class="req-panel" id="panelConsulta">
                <div id="summary-container"></div>

                <div class="filter-container">
                    <input type="number" id="filterId" placeholder="Filtrar por ID...">
                    <input type="text" id="filterSolicitante" placeholder="Filtrar por solicitante...">
                    <select id="filterStatus">
                        <option value="">Todos os Status</option>
                    </select>
                    <select id="filterPrioridade">
                        <option value="">Todas as Prioridades</option>
                        <option value="NORMAL">Normal</option>
                        <option value="ALTA">Alta</option>
                        <option value="BAIXA">Baixa</option>
                    </select>
                    <div class="form-group">
                        <label for="filterDataNecessidade">Data de Necessidade:</label>
                        <input type="date" id="filterDataNecessidade">
                    </div>
                </div>

                <div id="requisicoes-container">
                    <div class="loader-container">
                        <div class="loader"></div>
                        <p>Buscando requisições...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="script.js"></script>
    <script src="consulta.js"></script>
    <script src="layout.js"></script>
    <script src="fundos.js"></script>
    <script>
        // Controle das abas
        const tabs = document.querySelectorAll('.req-tab');
        const panels = document.querySelectorAll('.req-panel');

        tabs.forEach(tab => {
            tab.addEventListener('click', function() {
                tabs.forEach(t => t.classList.remove('active'));
                panels.forEach(p => p.classList.remove('active'));
                this.classList.add('active');
                document.getElementById('panel' + this.dataset.tab.charAt(0).toUpperCase() + this.dataset.tab.slice(1)).classList.add('active');
            });
        });

        // Se vier com ?tab=consulta na URL, abre direto na aba consulta
        const params = new URLSearchParams(window.location.search);
        if (params.get('tab') === 'consulta') {
            document.getElementById('tabConsulta').click();
        }

        // Dropzone do CSV: mostrar nome e suportar drag&drop
        (function() {
            const dropzone = document.getElementById('fileDropzone');
            const input = document.getElementById('csvFile');
            const title = document.getElementById('fileDropzoneTitle');
            if (!dropzone || !input || !title) return;

            function updateLabel(file) {
                if (file) {
                    title.textContent = file.name;
                    dropzone.classList.add('has-file');
                } else {
                    title.textContent = 'Clique para selecionar';
                    dropzone.classList.remove('has-file');
                }
            }

            input.addEventListener('change', () => updateLabel(input.files[0]));

            ['dragenter', 'dragover'].forEach(ev => {
                dropzone.addEventListener(ev, e => {
                    e.preventDefault();
                    e.stopPropagation();
                    dropzone.classList.add('is-dragover');
                });
            });
            ['dragleave', 'drop'].forEach(ev => {
                dropzone.addEventListener(ev, e => {
                    e.preventDefault();
                    e.stopPropagation();
                    dropzone.classList.remove('is-dragover');
                });
            });
            dropzone.addEventListener('drop', e => {
                const file = e.dataTransfer.files && e.dataTransfer.files[0];
                if (file && file.name.toLowerCase().endsWith('.csv')) {
                    const dt = new DataTransfer();
                    dt.items.add(file);
                    input.files = dt.files;
                    updateLabel(file);
                }
            });
        })();
    </script>
</body>
</html>
