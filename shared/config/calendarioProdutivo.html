<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendário Produtivo - SGC</title>
    <link rel="stylesheet" href="/shared/frontend/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .cal-prod-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        .breadcrumb {
            margin-bottom: 20px;
            font-size: 0.9em;
            color: #666;
        }
        .breadcrumb a {
            color: var(--cor-principal);
            text-decoration: none;
        }
        .page-header {
            background: linear-gradient(135deg, #0f766e 0%, #0ea5e9 100%);
            color: white;
            padding: 28px;
            border-radius: 12px;
            margin-bottom: 24px;
        }
        .page-header h1 {
            margin: 0 0 8px 0;
        }
        .config-box {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .grid-horas {
            display: grid;
            grid-template-columns: repeat(2, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #1a253c;
        }
        .form-group input[type="time"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #d0d7de;
            border-radius: 8px;
        }
        .dias-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(100px, 1fr));
            gap: 10px;
        }
        .dia-item {
            border: 1px solid #d0d7de;
            border-radius: 8px;
            padding: 12px 10px;
            text-align: center;
            background: #f8fafc;
        }
        .dia-item label {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-weight: 600;
            color: #334155;
        }
        .dia-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
        }
        .actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 22px;
        }
        .btn {
            border: none;
            border-radius: 8px;
            padding: 12px 18px;
            cursor: pointer;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary {
            background: var(--cor-principal);
            color: white;
        }
        .btn-secondary {
            background: #64748b;
            color: white;
        }
        .status-message {
            display: none;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .status-message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }
        .status-message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }
        @media (max-width: 900px) {
            .dias-grid {
                grid-template-columns: repeat(2, minmax(120px, 1fr));
            }
            .grid-horas {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="sidebar-container" class="sidebar"></div>

    <main class="main-content">
        <div class="cal-prod-container">
            <div class="breadcrumb">
                <a href="/shared/config/configuracoes.html"><i class="fa fa-cog"></i> Configurações</a>
                <i class="fa fa-chevron-right" style="font-size: 0.7em; margin: 0 8px;"></i>
                <span>Calendário Produtivo</span>
            </div>

            <div class="page-header">
                <h1><i class="fa fa-calendar-days"></i> Calendário Produtivo</h1>
                <p>Defina dias e horário padrão de funcionamento usados no cálculo do lead time produtivo.</p>
            </div>

            <div id="status-message" class="status-message"></div>

            <div class="config-box">
                <div class="grid-horas">
                    <div class="form-group">
                        <label for="horaInicio"><i class="fa fa-clock"></i> Hora de início</label>
                        <input type="time" id="horaInicio" value="08:00" required>
                    </div>
                    <div class="form-group">
                        <label for="horaFim"><i class="fa fa-clock"></i> Hora de fim</label>
                        <input type="time" id="horaFim" value="18:00" required>
                    </div>
                </div>

                <div class="form-group">
                    <label><i class="fa fa-calendar-week"></i> Dias produtivos</label>
                    <div class="dias-grid">
                        <div class="dia-item"><label><input type="checkbox" id="dia-seg" checked>Segunda</label></div>
                        <div class="dia-item"><label><input type="checkbox" id="dia-ter" checked>Terça</label></div>
                        <div class="dia-item"><label><input type="checkbox" id="dia-qua" checked>Quarta</label></div>
                        <div class="dia-item"><label><input type="checkbox" id="dia-qui" checked>Quinta</label></div>
                        <div class="dia-item"><label><input type="checkbox" id="dia-sex" checked>Sexta</label></div>
                        <div class="dia-item"><label><input type="checkbox" id="dia-sab">Sábado</label></div>
                        <div class="dia-item"><label><input type="checkbox" id="dia-dom">Domingo</label></div>
                    </div>
                </div>

                <div class="actions">
                    <button class="btn btn-secondary" type="button" id="btnPadrao"><i class="fa fa-rotate-left"></i> Padrão</button>
                    <button class="btn btn-primary" type="button" id="btnSalvar"><i class="fa fa-floppy-disk"></i> Salvar</button>
                </div>
            </div>
        </div>
    </main>

    <script src="calendarioProdutivo.js"></script>
    <script src="/shared/frontend/layout.js"></script>
</body>
</html>
