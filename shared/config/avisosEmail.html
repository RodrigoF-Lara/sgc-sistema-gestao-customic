<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avisos por e-mail - SGC</title>
  <link rel="stylesheet" href="/shared/frontend/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <style>
    .page-wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px 60px; }
    .page-header h1 { text-align: left; margin-bottom: 8px; color: var(--cor-principal); }
    .page-header p { color: #546e7a; margin: 0; }
    .card {
      background: #fff; border-radius: 12px; padding: 20px 22px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08); margin-top: 18px;
    }
    .card h2 { margin: 0 0 6px; font-size: 1.15rem; text-align: left; }
    .card p { color: #546e7a; margin: 0 0 12px; }
    .liga { display: flex; align-items: center; gap: 8px; font-weight: 700; color: #263238; margin: 8px 0 14px; }
    .emails { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; padding: 0; list-style: none; }
    .emails li {
      display: flex; align-items: center; gap: 8px; background: #e3f2fd; color: #0d47a1;
      border-radius: 999px; padding: 6px 8px 6px 12px; font-size: 0.92rem;
    }
    .emails button {
      border: 0; background: transparent; color: #0d47a1; cursor: pointer; font-size: 1rem; line-height: 1;
    }
    .linha { display: flex; gap: 8px; flex-wrap: wrap; }
    .linha input {
      flex: 1 1 220px; border: 1px solid #cfd8dc; border-radius: 8px; padding: 10px 12px; font: inherit;
    }
    .btn {
      border: 1px solid #cfd8dc; background: #fff; color: #263238; border-radius: 8px;
      padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer;
    }
    .btn.primary { background: var(--cor-principal, #1976d2); border-color: transparent; color: #fff; }
    .btn:disabled { opacity: 0.55; cursor: wait; }
    .aviso { border-radius: 8px; padding: 10px 14px; margin-top: 14px; font-weight: 600; }
    .aviso.ok { background: #e8f5e9; color: #1b5e20; }
    .aviso.erro { background: #ffebee; color: #b71c1c; }
    .vazio { color: #78909c; font-size: 0.9rem; margin: 0 0 12px; }
  </style>
</head>
<body>
  <div id="sidebar-container" class="sidebar"></div>
  <main class="main-content">
    <div class="page-wrap">
      <header class="page-header">
        <h1><i class="fa-solid fa-envelope"></i> Avisos por e-mail</h1>
        <p>Escolha qual processo envia e-mail e para quem. A mensagem sai de sgc@customicpulz.onmicrosoft.com. As credenciais da Microsoft continuam na Vercel.</p>
      </header>
      <div id="lista"></div>
      <div class="card" id="rodape" hidden>
        <button type="button" class="btn primary" id="btnSalvar">Salvar</button>
        <p id="aviso" class="aviso" hidden></p>
      </div>
    </div>
  </main>
  <script src="/shared/frontend/permissoes.js"></script>
  <script src="/shared/frontend/layout.js"></script>
  <script src="/shared/config/avisosEmail.js"></script>
</body>
</html>
